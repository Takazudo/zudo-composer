packages:
  - packages/*
  - fixtures/host
  - fixtures/themeset-host
  - doc

# packages/ui declares @zudo-composer/component-contract, preact and
# tailwindcss as peers only (#686 C0: no devDependencies/workspace: spec in
# that package, unlike packages/fixture-themeset's precedent). With
# autoInstallPeers on, pnpm tries to fetch the unpublished workspace-only
# contract package from the npm registry instead of resolving it from this
# root project's own devDependency. Node's ancestor node_modules walk still
# finds it there at runtime (typecheck, vitest) since packages/ui is nested
# under the repo root.
autoInstallPeers: false

allowBuilds:
  esbuild: true
  workerd: true

# Exact exclusions can list multiple versions with `||`. When an existing
# lockfile and the updated resolution both need an exception, combine the old
# and new versions in one entry, run `corepack pnpm install`, then prune only
# versions no longer present in the lockfile. Swapping the version in place
# before install makes the audit reject the still-committed old entry;
# `pnpm clean --lockfile` clears that error but re-resolves every `^` range in
# the repo, which is a much wider change than the bump itself.
minimumReleaseAgeExclude:
  - '@cloudflare/workerd-darwin-64@1.20260908.1'
  - '@cloudflare/workerd-darwin-arm64@1.20260908.1'
  - '@cloudflare/workerd-linux-64@1.20260908.1'
  - '@cloudflare/workerd-linux-arm64@1.20260908.1'
  - '@cloudflare/workerd-windows-64@1.20260908.1'
  - miniflare@5.20260908.0-alpha
  - workerd@1.20260908.1
  - wrangler@4.130.0
  - '@takazudo/zudo-doc-history-server@5.28.0'
  - '@takazudo/zudo-doc@5.28.0'
  - '@takazudo/zfb-darwin-arm64@2.22.0'
  - '@takazudo/zfb-darwin-x64@2.22.0'
  - '@takazudo/zfb-linux-arm64-gnu@2.22.0'
  - '@takazudo/zfb-linux-x64-gnu@2.22.0'
  - '@takazudo/zfb-md-wasm@2.22.0'
  - '@takazudo/zfb-runtime@2.22.0'
  - '@takazudo/zfb-win32-x64-msvc@2.22.0'
  - '@takazudo/zfb@2.22.0'
