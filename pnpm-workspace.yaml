packages:
  - packages/*
  - fixtures/host
  - fixtures/themeset-host
  - doc

# packages/ui declares @zudo-composer/component-contract, preact and
# tailwindcss as peers only (#686 C0: no devDependencies/workspace: spec in
# that package, unlike packages/fixture-themeset's precedent). With
# autoInstallPeers on, pnpm tries to fetch the unpublished workspace-only
# contract package from the npm registry instead of resolving it from this
# root project's own devDependency. Node's ancestor node_modules walk still
# finds it there at runtime (typecheck, vitest) since packages/ui is nested
# under the repo root.
autoInstallPeers: false

allowBuilds:
  esbuild: true
  workerd: true

# Entries are keyed by package NAME and the FIRST match wins, so a name can be
# excluded at only one version at a time. Bumping a package that is still inside
# the minimumReleaseAge window is therefore a two-step edit: the pre-install
# lockfile audit reads the OLD version from pnpm-lock.yaml, so list the old
# version ABOVE the new one, run `corepack pnpm install`, then delete the old
# line. Swapping the version in place instead makes the audit reject the
# still-committed old entry; `pnpm clean --lockfile` clears that error but
# re-resolves every `^` range in the repo, which is a much wider change than
# the bump itself.
minimumReleaseAgeExclude:
  - '@cloudflare/workerd-darwin-64@1.20260908.1'
  - '@cloudflare/workerd-darwin-arm64@1.20260908.1'
  - '@cloudflare/workerd-linux-64@1.20260908.1'
  - '@cloudflare/workerd-linux-arm64@1.20260908.1'
  - '@cloudflare/workerd-windows-64@1.20260908.1'
  - miniflare@5.20260908.0-alpha
  - workerd@1.20260908.1
  - wrangler@4.130.0
  - '@takazudo/zudo-doc-history-server@5.27.0'
  - '@takazudo/zudo-doc@5.27.0'
  - '@takazudo/zfb-darwin-arm64@2.20.3'
  - '@takazudo/zfb-darwin-x64@2.20.3'
  - '@takazudo/zfb-linux-arm64-gnu@2.20.3'
  - '@takazudo/zfb-linux-x64-gnu@2.20.3'
  - '@takazudo/zfb-md-wasm@2.20.3'
  - '@takazudo/zfb-runtime@2.20.3'
  - '@takazudo/zfb-win32-x64-msvc@2.20.3'
  - '@takazudo/zfb@2.20.3'
