name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          version: 11.5.2
          run_install: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm no-deploy:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm headless:negative-scan
      - run: pnpm site-project:boundary
      - run: pnpm contract:conformance
      - run: pnpm contract:negative-scan
      - run: pnpm contract:external-install
      - run: pnpm handoff:boundary
      - run: pnpm styles:class-names
      - run: pnpm provider:boundary
      - run: pnpm test
      - run: pnpm build
      - run: pnpm dist:boundary
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser:host
      - run: pnpm test:browser:dev
        env:
          CI: true
      - run: pnpm test:browser:site-project
      - run: pnpm build:hosted-demo
      - run: pnpm hosted-demo:verify dist-hosted-demo "${{ github.sha }}"
      # This lane consumes the already-built artifact; it must stay after the
      # build/manifest checks and before the artifact is handed to production.
      - run: pnpm test:browser:hosted-demo
      - run: pnpm test:browser:demos
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hosted-demo-${{ github.sha }}
          path: dist-hosted-demo
          if-no-files-found: error
          retention-days: 7
      # A browser failure that only happens on a runner is undiagnosable from the log
      # alone: Playwright writes the page snapshot, trace and video to disk, and the
      # log prints only their paths. Without this, reproducing such a failure locally
      # is the only route, and a runner-only failure is by definition not reproducible
      # there.
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  packed-host-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.hosts.outputs.matrix }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          version: 11.5.2
          run_install: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm no-deploy:check
      - id: hosts
        run: node scripts/packed-host-matrix.mjs --github-output

  packed-host-install:
    needs: packed-host-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Disk discovery includes studio and any later configured package. The
      # creator and existing synthesized proof receive their own jobs too.
      matrix: ${{ fromJSON(needs.packed-host-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          version: 11.5.2
          run_install: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm no-deploy:check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm smoke:host-install -- --host "$PACKED_HOST"
        env:
          PACKED_HOST: ${{ matrix.host }}

  demo-sites-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        site: [webshop, landing, blog]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          version: 11.5.2
          run_install: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # demo:build-site both builds and verifies the manifest (scripts/build-site-static.mjs).
      - run: pnpm demo:build-site ${{ matrix.site }}
      - run: pnpm site-static:verify "packages/demo-${{ matrix.site }}/dist-site" "${{ github.sha }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: demo-site-${{ matrix.site }}-${{ github.sha }}
          path: packages/demo-${{ matrix.site }}/dist-site
          if-no-files-found: error
          retention-days: 7
