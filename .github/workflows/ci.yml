name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          version: 11.5.2
          run_install: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm headless:negative-scan
      - run: pnpm site-project:boundary
      - run: pnpm contract:conformance
      - run: pnpm contract:negative-scan
      - run: pnpm contract:external-install
      - run: pnpm handoff:boundary
      - run: pnpm styles:class-names
      - run: pnpm provider:boundary
      - run: pnpm test
      - run: pnpm build
      - run: pnpm dist:boundary
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser:host
      - run: pnpm test:browser:dev
        env:
          CI: true
      - run: pnpm test:browser:site-project
