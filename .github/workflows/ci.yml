name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          version: 11.5.2
          run_install: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      # Unit tests include an actual isolated package-install regression too.
      - name: Expose pnpm to isolated hosts
        run: node scripts/prepare-packed-pnpm.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm no-deploy:check
      - run: pnpm public:check
      - run: pnpm sample:check
      - run: pnpm cms:check
      - run: pnpm consumer:boundary
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm headless:negative-scan
      - run: pnpm site-project:boundary
      - run: pnpm contract:conformance
      - run: pnpm contract:negative-scan
      - run: pnpm contract:external-install
      - run: pnpm handoff:boundary
      - run: pnpm styles:class-names
      - run: pnpm provider:boundary
      - run: pnpm ui:pack-check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm dist:boundary
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser:host
      - run: pnpm test:browser:dev
        env:
          CI: true
      # The site-project and demo browser lanes verify artifacts prepared here
      # and never rebuild them.
      - run: pnpm demo:build-sites
      - run: pnpm test:browser:site-project
      - run: pnpm test:browser:demos
      # A browser failure that only happens on a runner is undiagnosable from the log
      # alone: Playwright writes the page snapshot, trace and video to disk, and the
      # log prints only their paths. Without this, reproducing such a failure locally
      # is the only route, and a runner-only failure is by definition not reproducible
      # there.
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  packed-host-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.hosts.outputs.matrix }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          version: 11.5.2
          run_install: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm no-deploy:check
      - id: hosts
        run: node scripts/packed-host-matrix.mjs --github-output

  packed-host-install:
    needs: packed-host-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Disk discovery includes Sample and any later configured package. The
      # creator and existing synthesized proof receive their own jobs too.
      matrix: ${{ fromJSON(needs.packed-host-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          version: 11.5.2
          run_install: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      # The isolated host PATH excludes node_modules, including action-setup's
      # own bin directory. Expose only its pnpm executable through a clean shim.
      - name: Expose pnpm to isolated hosts
        run: node scripts/prepare-packed-pnpm.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm no-deploy:check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm smoke:host-install -- --host "$PACKED_HOST"
        env:
          PACKED_HOST: ${{ matrix.host }}

  demo-sites-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        site: [sample, shop, landing, blog]
        include:
          # Keep these paths explicit: the public target key `shop` maps to
          # the historical host directory packages/demo-webshop.
          - site: sample
            target: sample
            host_dir: packages/demo-sample
            dist_dir: packages/demo-sample/dist-site
            artifact_name: demo-site-sample
          - site: shop
            target: shop
            host_dir: packages/demo-webshop
            dist_dir: packages/demo-webshop/dist-site
            artifact_name: demo-site-shop
          - site: landing
            target: landing
            host_dir: packages/demo-landing
            dist_dir: packages/demo-landing/dist-site
            artifact_name: demo-site-landing
          - site: blog
            target: blog
            host_dir: packages/demo-blog
            dist_dir: packages/demo-blog/dist-site
            artifact_name: demo-site-blog
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          version: 11.5.2
          run_install: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build and verify the exact registry artifact. The explicit host_dir is
      # required because `shop` is backed by packages/demo-webshop.
      - run: pnpm demo:build-site "${{ matrix.host_dir }}"
      - run: pnpm hosted-demo:verify "${{ matrix.dist_dir }}" "${{ github.sha }}"
        env:
          HOSTED_DEMO_TARGET: ${{ matrix.target }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact_name }}-${{ github.sha }}
          path: ${{ matrix.dist_dir }}
          if-no-files-found: error
          retention-days: 7

  demo-editors-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        name: [sample, shop, landing, blog]
        include:
          - name: sample
            target: sample-editor
            dist_dir: packages/demo-sample/dist-editor
            artifact_name: demo-editor-sample
          - name: shop
            target: shop-editor
            dist_dir: packages/demo-webshop/dist-editor
            artifact_name: demo-editor-shop
          - name: landing
            target: landing-editor
            dist_dir: packages/demo-landing/dist-editor
            artifact_name: demo-editor-landing
          - name: blog
            target: blog-editor
            dist_dir: packages/demo-blog/dist-editor
            artifact_name: demo-editor-blog
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          version: 11.5.2
          run_install: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm demo:build-editor "${{ matrix.name }}"
      - run: pnpm hosted-demo:verify "${{ matrix.dist_dir }}" "${{ github.sha }}"
        env:
          HOSTED_DEMO_TARGET: ${{ matrix.target }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact_name }}-${{ github.sha }}
          path: ${{ matrix.dist_dir }}
          if-no-files-found: error
          retention-days: 7
      # Every editor host gets its own lane so one host cannot hide another's
      # browser failure behind the serial all-host runner.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser:demo-editor "${{ matrix.name }}"
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-results-demo-editor-${{ matrix.name }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  doc-site-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The doc-history preBuild is verified with the default shallow checkout.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          version: 11.5.2
          run_install: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm doc:build-site
      - run: pnpm hosted-demo:verify doc/dist "${{ github.sha }}"
        env:
          HOSTED_DEMO_TARGET: doc
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: doc-site-${{ github.sha }}
          path: doc/dist
          if-no-files-found: error
          retention-days: 7
